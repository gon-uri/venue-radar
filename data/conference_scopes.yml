# Curated series-level profiles, not exhaustive CFP topic inventories.
# Keep edition dates/main display topics in conferences.yml. An empty additional
# list is valid for a focused venue; never add tags just to reach a target count.
# source_year identifies the evidence edition, not every edition using a profile.

EuroGP:
  additional_topics:
    - Learning Theory & Statistical Foundations
    - Deep Representation Learning
  scope_summary: >-
    Genetic programming and evolutionary program synthesis, including symbolic
    regression, program representations and operators, surrogate-assisted search,
    multi-objective evolution, and interpretable learned programs. Evolutionary
    machine learning, AutoML pipelines, and neuroevolution connect this focused
    methodological community to ML. Application domains do not define its tags.
  scope_source_urls:
    - https://www.evostar.org/2027/eurogp/
  scope_last_checked: '2026-10-07'
  source_year: 2027

KR:
  additional_topics:
    - Machine Learning
    - Probabilistic, Causal & Uncertainty ML
    - Planning & Search
  scope_summary: >-
    Formal and symbolic AI centered on representing knowledge and drawing
    justified conclusions: knowledge bases, description and non-classical
    logics, ontologies, non-monotonic reasoning, argumentation, belief revision,
    and reasoning about actions. Learning, uncertainty, and explanations matter
    when grounded in knowledge representation or reasoning. The last published
    CFP includes a KR Meets Machine Learning and Explanation track; this is not
    a general-purpose ML conference or a confirmed promise of that 2027 track.
  scope_source_urls:
    - https://kr.org/KR2026/call_main_track.html
    - https://kr.org/KR2026/
  scope_last_checked: '2026-10-07'
  source_year: 2026

ICAPS:
  additional_topics:
    - Probabilistic, Causal & Uncertainty ML
  scope_summary: >-
    Automated planning and scheduling, heuristic search, constraint-based
    reasoning, temporal and hierarchical planning, and planning under uncertainty.
    Learning and foundation models fit when they substantially advance planning
    or scheduling, including model acquisition and search guidance. The main CFP
    explicitly excludes reinforcement-learning papers without a substantive
    planning contribution; general reward-based learning is not a blanket tag.
  scope_source_urls:
    - https://icaps27.icaps-conference.org/calls/cfp/
  scope_last_checked: '2026-10-07'
  source_year: 2027

3DV:
  additional_topics: []
  scope_summary: >-
    Three-dimensional computer vision and graphics, especially sensing,
    geometric modeling and representations, reconstruction, analysis, rendering,
    and visualization. It is a focused venue for recovering and understanding
    3D structure rather than all of computer vision. Papers combine geometric,
    imaging, and computational methods; unrelated applications and every
    possible ML technique are not added as separate scope tags.
  scope_source_urls:
    - https://3dvconf.github.io/2027/
    - https://3dvconf.github.io/2027/author-guidelines/
  scope_last_checked: '2026-10-07'
  source_year: 2027

ACM MM:
  additional_topics:
    - Machine Learning
    - Natural Language Processing & LLMs
    - Human-AI Interaction & Deployment
    - Data Mining & Data Science
    - Explainability & Interpretability
  scope_summary: >-
    Multimedia understanding, learning, generation, and retrieval across image,
    video, audio, language, and other modalities. Characteristic work includes
    multimodal fusion, generative and foundation models, scalable indexing and
    search, cross-modal alignment, and human-centered multimedia experiences.
    The 2026 steering-committee scope also emphasizes explainability. Healthcare,
    education, and entertainment are applications, not blanket topical identities.
  scope_source_urls:
    - https://2026.acmmm.org/site/topics.html
    - https://2026.acmmm.org/
  scope_last_checked: '2026-10-07'
  source_year: 2026

ACM SIGGRAPH:
  additional_topics:
    - Deep Representation Learning
    - Human-AI Interaction & Deployment
  scope_summary: >-
    Computer graphics and interactive techniques, centered on rendering,
    geometric modeling, animation, physical simulation, imaging, visualization,
    and immersive visual experiences. Generative AI and machine learning are
    relevant when they advance visual computing, such as neural rendering and
    learned animation. Technical papers use integrated conference and ACM TOG
    journal tracks; this profile does not describe SIGGRAPH Asia or all of AI.
  scope_source_urls:
    - https://s2026.siggraph.org/program/technical-papers/
  scope_last_checked: '2026-10-07'
  source_year: 2026

BMVC:
  additional_topics:
    - Signal Processing
  scope_summary: >-
    Computer vision, image processing, and visual pattern recognition, including
    visual learning, recognition and segmentation, reconstruction, motion and
    video analysis, and evaluation of vision methods. The single-track BMVA
    conference combines methodological and applied vision research. It is an
    established broad vision venue, not a specialist biomedical-imaging meeting.
  scope_source_urls:
    - https://bmvc2026.bmva.org/calls/call-for-papers/
  scope_last_checked: '2026-10-07'
  source_year: 2026

CVPR:
  additional_topics:
    - Computer Graphics & Visualization
    - Multimedia Learning & Retrieval
    - Natural Language Processing & LLMs
    - Biometrics & Human Sensing
    - Robustness & Safety
  scope_summary: >-
    Broad computer vision and pattern recognition: visual representations,
    recognition and segmentation, 3D reconstruction, computational imaging,
    image and video generation, motion and tracking, and vision-language
    learning. Graphics, multimodal learning, human face/body understanding, and
    reliable vision are substantial recurring research areas. Peripheral
    application fields are not tagged merely because a long CFP mentions them.
  scope_source_urls:
    - https://cvpr.thecvf.com/Conferences/2027/CallForPapers
  scope_last_checked: '2026-10-07'
  source_year: 2027

ECCV:
  additional_topics:
    - Computer Graphics & Visualization
    - Multimedia Learning & Retrieval
    - Natural Language Processing & LLMs
    - Biometrics & Human Sensing
    - Robustness & Safety
  scope_summary: >-
    Broad research in visual perception, representation learning, recognition,
    segmentation, 3D geometry and reconstruction, computational imaging, and
    image/video synthesis. Vision-language models, multimodal understanding,
    human motion and appearance, and robust visual systems extend this core.
    ECCV is the biennial European flagship for computer vision; the scope uses
    the actual published 2026 CFP, not an invented 2028 call.
  scope_source_urls:
    - https://eccv.ecva.net/Conferences/2026/CallForPapers
  scope_last_checked: '2026-10-07'
  source_year: 2026

EUVIP:
  additional_topics:
    - Multimedia Learning & Retrieval
    - Computer Graphics & Visualization
    - Biometrics & Human Sensing
    - Robustness & Safety
  scope_summary: >-
    Visual information processing across image, video, 3D, and unconventional
    sensing modalities. Its defining areas are computational imaging,
    restoration and enhancement, coding, recognition, multimodal fusion, and
    subjective/objective quality assessment. Rendering and visualizing data,
    human/biometric analysis, and robust evaluation are recurring strands.
    An extensive applications list is not treated as equal coverage of every
    application domain or every responsible-AI subtopic.
  scope_source_urls:
    - https://euvip2026.github.io/C4P.pdf
    - https://euvip2026.github.io/calls/
  scope_last_checked: '2026-10-07'
  source_year: 2026

FG:
  additional_topics:
    - Robustness & Safety
    - Fairness & Responsible AI
    - Computer Graphics & Visualization
    - Explainability & Interpretability
  scope_summary: >-
    Face, gesture, body movement, and human behavior from images and video,
    including detection, tracking, recognition, facial expression and affect,
    pose and action analysis, and soft biometrics. Characteristic methods include
    advanced visual learning, generative modeling and neural rendering, multimodal
    fusion, and evaluation across demographic and acquisition conditions.
    Bias, interpretability, and robust recognition are directly tied to human
    sensing rather than generic application tags.
  scope_source_urls:
    - https://fg2027.ieee-biometrics.org/call-for-papers/
  scope_last_checked: '2026-10-07'
  source_year: 2027

ICCV:
  additional_topics:
    - Computer Graphics & Visualization
    - Multimedia Learning & Retrieval
    - Natural Language Processing & LLMs
    - Biometrics & Human Sensing
    - Robustness & Safety
  scope_summary: >-
    Broad computer vision, from geometry and computational imaging to visual
    learning, recognition, segmentation, generation, and video understanding.
    Vision-language and multimodal methods, visual graphics, face/body/gesture
    analysis, and reliable perception are substantial strands. It is a biennial
    flagship, not a general AI applications conference. The current scope is
    grounded in its 2025 CFP because the 2027 call is not yet published.
  scope_source_urls:
    - https://iccv.thecvf.com/Conferences/2025/CallForPapers
  scope_last_checked: '2026-10-07'
  source_year: 2025

ICMR:
  additional_topics:
    - Data Mining & Data Science
    - Natural Language Processing & LLMs
    - Privacy-preserving ML
  scope_summary: >-
    Search and retrieval of multimedia and multimodal content. Characteristic
    work studies indexing, content understanding, query representations,
    cross-modal matching, relevance feedback, recommendation, and evaluation,
    with deep learning and multimodal models as important methods. Privacy-aware
    retrieval and knowledge discovery extend this core. The long applications
    list is not used to characterize ICMR as a medicine, finance, or travel venue.
  scope_source_urls:
    - https://www.icmr2027.org/cfc
  scope_last_checked: '2026-10-07'
  source_year: 2027

IJCB:
  additional_topics:
    - Machine Learning
    - Robustness & Safety
    - Fairness & Responsible AI
    - Explainability & Interpretability
    - Federated & Distributed Learning
    - Signal Processing
  scope_summary: >-
    Biometrics and identity science across face, fingerprint, iris, voice,
    gait, and behavioral modalities. Defining concerns include recognition and
    verification, multimodal fusion, presentation-attack and deepfake detection,
    biometric template security, privacy, demographic fairness, and rigorous
    benchmarking. Learned representations and foundation models are important
    methods; federated learning belongs here through secure biometric systems.
    Healthcare, banking, and robotics are applications, not blanket scope tags.
  scope_source_urls:
    - https://ijcb2027.ieee-biometrics.org/call-for-papers/
  scope_last_checked: '2026-10-07'
  source_year: 2027

WACV:
  additional_topics:
    - Signal Processing
    - Biometrics & Human Sensing
    - Multimedia Learning & Retrieval
  scope_summary: >-
    Applied computer vision and visual learning, with an emphasis on practical
    recognition, detection, segmentation, image/video analysis, 3D perception,
    and deployable visual systems. Human analysis and multimodal visual methods
    are established areas. Compared with the flagship trio, WACV particularly
    welcomes meaningful application-driven contributions supported by sound
    evaluation; its two submission rounds are routes, not different fields.
  scope_source_urls:
    - https://wacv.thecvf.com/Conferences/2027/CallForPapers
  scope_last_checked: '2026-10-07'
  source_year: 2027

NeurIPS:
  additional_topics:
    - Learning Theory & Statistical Foundations
    - Probabilistic, Causal & Uncertainty ML
    - Reinforcement Learning
    - Natural Language Processing & LLMs
    - Computer Vision & Pattern Recognition
    - ML Systems & Infrastructure
  scope_summary: >-
    Broad research in machine learning, especially deep and generative models,
    statistical foundations, optimization, probabilistic inference, and learning
    for decision-making. Language, vision, and scalable ML systems are important
    research communities. Interdisciplinary applications should contribute
    insight of wider interest to the machine-learning community.
  scope_source_urls:
    - https://neurips.cc/Conferences/2026/CallForPapers
  scope_last_checked: '2026-10-07'
  source_year: 2026

ICML:
  additional_topics:
    - Probabilistic, Causal & Uncertainty ML
    - Reinforcement Learning
    - Explainability & Interpretability
    - Robustness & Safety
    - ML Systems & Infrastructure
    - Federated & Distributed Learning
  scope_summary: >-
    Methodological and theoretical machine learning, including supervised and
    unsupervised learning, deep generative models, optimization, statistical
    learning theory, Bayesian methods, and reinforcement learning. Scalable
    systems and trustworthy learning are established parts of the scope;
    application papers should offer contributions of wider interest to ML.
  scope_source_urls:
    - https://icml.cc/Conferences/2026/CallForPapers
  scope_last_checked: '2026-10-07'
  source_year: 2026

ICLR:
  additional_topics:
    - Learning Theory & Statistical Foundations
    - Probabilistic, Causal & Uncertainty ML
    - Reinforcement Learning
    - Natural Language Processing & LLMs
    - Computer Vision & Pattern Recognition
    - ML Systems & Infrastructure
  scope_summary: >-
    Learning representations and understanding deep learning, with an emphasis
    on self-supervised learning, generative models, transfer and meta-learning,
    and the optimization and theory of learned representations. Language,
    vision, probabilistic modeling, and reinforcement learning are substantial
    areas, rather than unrelated application-domain tags.
  scope_source_urls:
    - https://iclr.cc/Conferences/2027/CallForPapers
  scope_last_checked: '2026-10-07'
  source_year: 2027

UAI:
  additional_topics:
    - Deep Representation Learning
    - Reinforcement Learning
    - Time Series & Sequential Data
    - Explainability & Interpretability
    - Robustness & Safety
  scope_summary: >-
    Learning and reasoning under uncertainty, centered on probabilistic and
    Bayesian modeling, graphical models, causal inference, approximate inference,
    and decision theory. Includes Monte Carlo and variational methods,
    uncertainty quantification, sequential models, and principled analysis of
    learning algorithms. Uncertainty is the organizing theme, not just another
    application of general-purpose AI.
  scope_source_urls:
    - https://www.auai.org/uai2026/subject_areas
    - https://www.auai.org/uai2026/call_for_papers
  scope_last_checked: '2026-10-07'
  source_year: 2026

AISTATS:
  additional_topics: []
  scope_summary: >-
    Research at the interface of artificial intelligence, machine learning, and
    statistics. Its defining emphasis is on statistical foundations and
    methodology for learning and inference, rather than a particular
    application domain. Research bridges statistical reasoning and learning
    algorithms, with archival contributions to both communities.
  scope_source_urls:
    - https://aistats.org/aistats2027/
    - https://aistats.org/aistats2027/call-for-papers.html
  scope_last_checked: '2026-10-07'
  source_year: 2027

COLT:
  additional_topics:
    - Deep Representation Learning
    - Probabilistic, Causal & Uncertainty ML
    - Reinforcement Learning
    - Privacy-preserving ML
    - Fairness & Responsible AI
  scope_summary: >-
    Theoretical foundations of learning at the intersection of computer science,
    statistics, and applied mathematics. Characteristic work studies learnability,
    sample and computational complexity, online learning, optimization, bandits,
    and generalization. Neural-network, causal, reinforcement-learning, privacy,
    and fairness papers belong here when the theoretical contribution is central.
  scope_source_urls:
    - https://learningtheory.org/colt2026/cfp.html
  scope_last_checked: '2026-10-07'
  source_year: 2026

ACML:
  additional_topics:
    - Deep Representation Learning
    - Probabilistic, Causal & Uncertainty ML
    - Reinforcement Learning
    - Natural Language Processing & LLMs
    - Fairness & Responsible AI
    - Privacy-preserving ML
  scope_summary: >-
    Theory and practice of machine learning, including probabilistic methods,
    representation learning, transfer and meta-learning, reinforcement learning,
    and learning theory. Generative models, language models, and trustworthy
    learning extend this core. The broad applications list is not treated as
    evidence that every application field defines the conference.
  scope_source_urls:
    - https://www.acml-conf.org/2026/calls/papers/
  scope_last_checked: '2026-10-07'
  source_year: 2026

KDD:
  additional_topics:
    - Deep Representation Learning
    - Natural Language Processing & LLMs
    - Explainability & Interpretability
    - Privacy-preserving ML
    - ML Systems & Infrastructure
  scope_summary: >-
    Knowledge discovery and data science, centered on extracting useful
    structure from large, heterogeneous data. Characteristic areas include
    clustering, structured and relational learning, graph and text mining,
    recommender systems, scalable data analysis, and responsible data use.
    Generative AI is relevant when it advances data science, not simply because
    a paper uses an LLM.
  scope_source_urls:
    - https://kdd2027.kdd.org/research-track-call-for-papers/
  scope_last_checked: '2026-10-07'
  source_year: 2027

EACL:
  additional_topics:
    - Explainability & Interpretability
    - Fairness & Responsible AI
    - Cognitive Science & Computational Cognition
  scope_summary: >-
    Computational linguistics and natural language processing, including
    language modeling, multilingual processing, translation, dialogue,
    information extraction, semantics, and linguistic analysis. Human-centered
    evaluation, interpretability, and bias are relevant within language research.
    The reviewed 2027 theme strengthens connections to psycholinguistics and
    cognitive modeling; peripheral application domains are not extra tags.
  scope_source_urls:
    - https://2027.eacl.org/calls/papers/
  scope_last_checked: '2026-10-07'
  source_year: 2027

AutoML:
  additional_topics:
    - Probabilistic, Causal & Uncertainty ML
    - Reinforcement Learning
    - Explainability & Interpretability
    - Natural Language Processing & LLMs
    - Robustness & Safety
  scope_summary: >-
    Automating the construction and configuration of learning systems:
    hyperparameter optimization, Bayesian optimization, neural architecture
    search, model selection, meta-learning, and pipeline automation. Includes
    evolutionary and reinforcement-learning approaches, AutoML for foundation
    models, and evaluation through applications, benchmarks, challenges, and
    datasets. Trustworthiness matters specifically in automated ML workflows.
  scope_source_urls:
    - https://2026.automl.cc/call-for-papers/
  scope_last_checked: '2026-10-07'
  source_year: 2026

LoG:
  additional_topics:
    - Complex Systems & Network Science
    - Probabilistic, Causal & Uncertainty ML
    - Signal Processing
    - Robustness & Safety
    - ML Systems & Infrastructure
  scope_summary: >-
    Learning on graphs and geometry: graph neural networks, equivariant models,
    graph kernels, geometric and graph generative models, and statistical theory
    for structured data. Graph signal processing, causal graph models, robustness,
    and scalable graph-learning infrastructure are meaningful extensions. A
    graph or geometric contribution should remain central, even in an application
    such as language or molecular modeling.
  scope_source_urls:
    - https://logconference.org/cfp/
  scope_last_checked: '2026-10-07'
  source_year: 2026

CoRL:
  additional_topics:
    - Computer Vision & Pattern Recognition
    - Probabilistic, Causal & Uncertainty ML
    - Human-AI Interaction & Deployment
    - Robustness & Safety
    - Learning Theory & Statistical Foundations
  scope_summary: >-
    Machine learning for physical robots, especially imitation and reinforcement
    learning, learned perception and control, robot foundation models, and
    learning-based task and motion planning. Includes uncertainty, generalization,
    safety, human-robot interaction, and datasets grounded in manipulation,
    navigation, or locomotion. General ML is relevant when it makes a substantive
    contribution to robot learning.
  scope_source_urls:
    - https://www.corl.org/contributions/call-for-papers
  scope_last_checked: '2026-10-07'
  source_year: 2026

GECCO:
  additional_topics:
    - Deep Representation Learning
    - Learning Theory & Statistical Foundations
  scope_summary: >-
    Genetic and evolutionary computation, including genetic algorithms,
    genetic programming, swarm intelligence, evolutionary multiobjective and
    combinatorial optimization, metaheuristics, and neuroevolution. Machine
    learning is relevant through evolutionary learning and optimization, not as
    an unrestricted substitute for the conference's evolutionary-computation
    focus.
  scope_source_urls:
    - https://gecco-2027.sigevo.org/Call+for+Papers
  scope_last_checked: '2026-10-07'
  source_year: 2026

SaTML:
  additional_topics:
    - Machine Learning
    - ML Systems & Infrastructure
  scope_summary: >-
    Security, safety, and trustworthiness of machine learning. Characteristic
    work studies attacks and defenses, privacy, verification, ML-system security,
    fairness, interpretability, and trustworthy data curation. Theoretical,
    empirical, and applied papers must engage substantively with a safety or
    trustworthiness question; merely using an ML model is insufficient.
  scope_source_urls:
    - https://satml.org/call-for-papers/
  scope_last_checked: '2026-10-07'
  source_year: 2027

ProbML:
  additional_topics:
    - Deep Representation Learning
    - Reinforcement Learning
    - Time Series & Sequential Data
    - Robustness & Safety
  scope_summary: >-
    Probabilistic and Bayesian machine learning, emphasizing approximate
    inference, variational and Monte Carlo methods, Gaussian processes,
    graphical and state-space models, calibration, and decisions under
    uncertainty. Includes Bayesian optimization and uncertainty-aware deep
    learning. The reviewed 2026 application focus is healthcare and climate;
    probabilistic reasoning remains essential to a suitable contribution.
  scope_source_urls:
    - https://probml.cc/call/
  scope_last_checked: '2026-10-07'
  source_year: 2026

AAMAS:
  additional_topics:
    - Deep Representation Learning
    - Probabilistic, Causal & Uncertainty ML
    - Control & Robotics
    - Complex Systems & Network Science
    - Ethics & Governance
    - Explainability & Interpretability
  scope_summary: >-
    Autonomous agents and multi-agent systems: learning and adaptation,
    coordination, game theory, planning, reasoning, agent engineering, and
    agent-based simulation. Also covers human-agent interaction, robot teams,
    norms and governance, and generative agents. The contribution should concern
    agents or their interaction; generic language-model or learning results are
    not automatically in scope.
  scope_source_urls:
    - https://warwick.ac.uk/fac/sci/dcs/aamas2027/calls/call-for-main-track/
  scope_last_checked: '2026-10-07'
  source_year: 2027

MLSys:
  additional_topics:
    - Reinforcement Learning
    - Privacy-preserving ML
  scope_summary: >-
    The intersection of machine learning and computer systems, including
    efficient training, inference and serving, compilers and runtimes,
    programming abstractions, specialized hardware, distributed learning,
    and system monitoring. LLM and agentic workloads are considered from a
    systems perspective. Both systems for ML and ML methods that improve
    computing systems are relevant.
  scope_source_urls:
    - https://mlsys.org/Conferences/2027/CallForResearchPapers
  scope_last_checked: '2026-10-07'
  source_year: 2027

CogSci:
  additional_topics: []
  scope_summary: >-
    Interdisciplinary study of cognition and the mind, connecting psychology,
    linguistics, artificial intelligence, neuroscience, philosophy, anthropology,
    and education. Computational models and experiments should illuminate
    cognitive processes and behavior. An AI paper belongs here through its
    contribution to understanding cognition, not solely through a predictive
    performance improvement.
  scope_source_urls:
    - https://cognitivesciencesociety.org/submissions-faq/
    - https://cognitivesciencesociety.org/
  scope_last_checked: '2026-10-07'
  source_year: 2026

ICIP:
  additional_topics: []
  scope_summary: >-
    Image and video processing across theory, algorithms, and imaging systems.
    Characteristic problems include restoration, enhancement, reconstruction,
    registration, compression, quality assessment, and visual analysis. Learning
    methods and generative models are relevant when they advance image or video
    processing. The long list of imaging application domains is intentionally
    not converted into extra specialist-conference tags.
  scope_source_urls:
    - https://2026.ieeeicip.org/topics/
  scope_last_checked: '2026-10-07'
  source_year: 2026

Interspeech:
  additional_topics: []
  scope_summary: >-
    Speech science and speech technology, linking spoken-language research
    with computational methods for speech recognition, speech synthesis, and
    speech communication. Machine learning and language models are relevant
    through speech and spoken-language problems. The current 2027 overview
    emphasizes the relationship between speech research and spoken-language
    technologies.
  scope_source_urls:
    - https://interspeech2027.org/
  scope_last_checked: '2026-10-07'
  source_year: 2027

FMTS @ NeurIPS:
  additional_topics:
    - System Identification & Data-driven Dynamics
    - Robustness & Safety
  scope_summary: >-
    Foundation models for temporal systems, centered on long-horizon and
    probabilistic forecasting, temporal pretraining, generative simulation,
    irregularly sampled and multimodal sequences, and state-space architectures.
