  - Ethics & Governance
  scope_summary: >-
    Mathematically rigorous research on computation and society, held annually since 2020
    with LIPIcs proceedings. The community brings theoretical computer science, statistics,
    economics and related analytical fields to pressing societal problems. Characteristic
    work covers theoretical fairness in machine learning (definitions, algorithms, lower
    bounds and trade-offs), formal privacy and especially differential privacy, computational
    social choice including apportionment and redistricting, fair allocation and division,
    and incentives and mechanism design for social good. The call also lists robustness and
    formal explainability, bias in the formation of and diffusion through social networks,
    mathematical links between computer science, law and ethics, and AI safety and alignment,
    and invites rigorous work on less-studied domains such as education, housing, climate and
    labor markets. Submissions should explain their contribution to responsible computing and
    include proofs of central claims.
