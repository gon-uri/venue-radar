  additional_topics:
  - Nonlinear Dynamics & Chaos
  - Graphs & Graph Learning
  scope_summary: Biennial interdisciplinary symposium on mathematical systems theory, networks and control that
    brings mathematicians and engineers together. Characteristic strands are linear, nonlinear, algebraic, hybrid
    and infinite-dimensional (distributed-parameter, port-Hamiltonian) systems, operator theory, optimal, robust and
    stochastic control, estimation, optimization, and networked systems and systems on graphs. The 2026 program
    placed particular emphasis on learning-based and data-driven control with formal guarantees, and keeps a
    tradition of a plenary talk in mathematics. Applied machine learning without a systems-theoretic contribution
    is not the defining focus.
  scope_source_urls:
