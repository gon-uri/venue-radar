  - https://uwaterloo.ca/international-symposium-mathematical-theory-networks-systems/program/technical-program
  - https://uwaterloo.ca/international-symposium-mathematical-theory-networks-systems/sites/default/files/uploads/documents/mtns2026_program_booklet.pdf
  scope_last_checked: '2026-10-31'
  source_year: 2026

NAISys:
  additional_topics:
  - Cognitive Science & Computational Cognition
  - Explainability & Interpretability
  - Control & Robotics
  scope_summary: Cold Spring Harbor Laboratory's NeuroAI meeting on how principles and insights from neuroscience
    can lead to better artificial intelligence, motivated by natural intelligence's real-time interaction with the
    world, adaptation to change and operation under physical and energetic constraints. The 2027 call (unchanged
    from 2024) highlights neurally inspired learning and meta-learning rules, neurally inspired circuits and network
    architectures, computing with spiking networks, continual and online learning, inductive biases, active perception,
    and unsupervised and self-supervised learning, with interpretable neural networks, cognitive models in AI and
    bio-inspired robotics as named topics. Talks mix invited speakers from neuroscience and machine learning with
    organizer-selected abstracts across eight oral and two poster sessions; contributions are new, unpublished one-page
    abstracts rather than papers.
  scope_source_urls:
  - https://meetings.cshl.edu/meetings.aspx?meet=NAISYS&year=27
  - https://meetings.cshl.edu/meetings.aspx?meet=NAISYS&year=24
  scope_last_checked: '2026-10-31'
  source_year: 2027

NCM:
  additional_topics:
  - Control & Robotics
  scope_summary: How the brain controls the eyes, head, trunk and limbs, studied from genetic expression and intracellular
    function to whole-organism behavior, with a strong clinical-investigator community. Themes include eye and head
    movement, posture and gait, reaching and grasping, sensorimotor integration, motor adaptation and plasticity, and
    disorders of motor control. A characteristic theoretical and computational motor-control strand covers internal
    models, prediction and motor learning; the 2027 satellite examines cerebellar computation. Control & Robotics
    reflects this biological sensorimotor-control theory, not robotics engineering. Members submit team sessions (panels,
    perspectives, tutorials), individual oral talks and posters as non-archival abstracts.
  scope_source_urls:
  - https://ncm-society.org/submission/
  - https://ncm-society.org/about-the-society/
  - https://ncm-society.org/satellite-meeting/
  scope_last_checked: '2026-10-31'
  source_year: 2027

NetSci-X:
  additional_topics:
  - Data Mining & Data Science
  scope_summary: 'The Network Science Society''s winter school and conference, meant to broaden participation in
    network science and grow its communities around the world. Its scope is network science across computer and
    information sciences, physics, mathematics, statistics, life sciences, neuroscience, environmental and social
    sciences, economics and finance. NetSciX 2026 illustrates the mix: a school on meso-scale structure and its
    statistical inference, deep graph learning and ecological networks, and thematic sessions on biological networks,
    human mobility, the science of science and algorithmic fairness in network science. NetSciX 2027 adds a special
    focus, Network Science meets AI, covering network methods for AI problems and AI subjects such as graph neural
    networks and LLMs. Contributions are short extended abstracts for talks or posters, without announced proceedings.
    Network methods, not any single application domain, define the meeting; its application breadth is not a specialist
    identity.'
  scope_source_urls:
  - https://netscix2027.github.io/
  - https://netscix2027.github.io/submissions/
  - https://netscisociety.net/call-for-netscix-2028/
  - https://netscix2026.github.io/
  scope_last_checked: '2026-10-31'
  source_year: 2027

Neural Interfaces:
  additional_topics:
  - Systems & Experimental Neuroscience
  - Signal Processing
  - Machine Learning
  - Ethics & Governance
  scope_summary: Translational neurotechnology meeting run by the North American Neuromodulation Society and descended
    from the 1970 NIH Neural Prosthesis Workshop. It centres on invasive and non-invasive neural interfaces, including
    brain-computer interfaces, sensory and motor neuroprostheses (auditory and visual prostheses among them), deep-brain
    and peripheral-nerve stimulation, bioelectronic medicine, electrodes, materials, wireless devices, and neural
    recording and signal processing. Clinical applications in pain, movement disorders and rehabilitation sit beside
    data and AI methods, regulatory and commercial translation, outcomes, ethics and policy. Clinicians, engineers,
    scientists, industry and agencies such as NIH and FDA take part. Contributions are research abstracts and
    community-proposed sessions rather than full papers; machine learning appears as a tool for neural interfaces,
    not as a general ML venue.
  scope_source_urls:
