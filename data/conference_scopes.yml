  scope_last_checked: '2026-10-31'
  source_year: 2027

PPSN:
  additional_topics:
    - Learning Theory & Statistical Foundations
  scope_summary: >-
    Natural computing and iterative optimization heuristics: evolutionary
    algorithms and evolution strategies, genetic programming, evolutionary
    multi-objective and surrogate-assisted optimization, and other
    nature-inspired or randomized search methods. Work ranges from rigorously
    derived mathematical results on search heuristics (a distinct
    runtime-analysis theory strand) to carefully designed empirical and
    benchmarking studies, and the call explicitly welcomes connections between
    search heuristics and machine learning or other AI approaches. Application
    domains do not define its tags.
  scope_source_urls:
    - https://ppsn2026.disi.unitn.it/
    - https://ppsn2026.disi.unitn.it/program.html
  scope_last_checked: '2026-10-31'
  source_year: 2026

RLC:
  additional_topics:
  - Learning Theory & Statistical Foundations
  - Deep Representation Learning
  - Planning & Search
  - Autonomous Agents & Multiagent Systems
  scope_summary: Dedicated venue for reinforcement learning research, whose accepted papers appear in the Reinforcement
    Learning Journal. Its core is RL algorithms and new problem settings, exploration, hierarchical RL and skill
    discovery, bandits, RL theory and unifying foundations, model-based planning under uncertainty, deep RL, multi-agent
    RL and self-play, imitation and inverse RL, and RL from human feedback or verified rewards. Evaluation methodology,
    benchmarks and replicability are explicit categories alongside applied RL. Safety, fairness and interpretability
    enter as social aspects of RL, and neuroscience or cognitive-science work is welcome when it targets a computational
    RL audience. Review favours rigorous methods and clearly scoped contribution claims over perceived importance.
  scope_source_urls:
  - https://rl-conference.cc/2026/callforpapers.html
  - https://rl-conference.cc/2026/index.html
  scope_last_checked: '2026-10-31'
  source_year: 2026

RLDM:
  additional_topics:
  - Machine Learning
  - Systems & Experimental Neuroscience
  scope_summary: >-
    Interdisciplinary, non-archival meeting on learning and decision making over
    time to achieve a goal, in humans, animals and algorithms, with a particular
    focus on reinforcement learning. It deliberately joins a "dry" community
    (artificial intelligence, machine learning, autonomous systems, robotics) with
    a "wet" one (cognitive science, neuroscience, psychology, behavioural
    economics, ethology). Contributions may report empirical results from human,
    animal or animat experiments, theory, simulations or modeling, and should
    speak to an interdisciplinary audience without sacrificing technical depth.
    The 2025 program spanned exploration, planning, habits and agency,
    multi-agent interaction, world models, computational psychiatry and neural
    learning signals such as dopamine. Because there are no proceedings, work
    submitted elsewhere is welcome.
  scope_source_urls:
  - https://rldm.org/
  - https://rldm.org/call-for-abstracts-2027/
  - https://rldm.org/past-meetings/rldm2025/program-at-a-glance/
  scope_last_checked: '2026-10-31'
  source_year: 2027

SIGDIAL:
  additional_topics:
  - Human-AI Interaction & Deployment
  - Autonomous Agents & Multiagent Systems
  scope_summary: Discourse and dialogue research from the joint ACL/ISCA special interest group. Core areas are task-oriented
    and open-domain dialogue systems (spoken, multimodal, situated or text-based), including state tracking, policy learning,
    generation and evaluation; discourse processing such as coherence relations, discourse parsing, reference resolution
    and argument mining; and pragmatics and semantics of conversation beyond the single sentence, supported by corpus, annotation
    and evaluation methodology. The 2026 call adds dedicated areas on LLM-based dialogue technologies, agentic AI in which
    dialogue drives reasoning, planning and tool use (with multi-agent coordination, negotiation and human-agent teaming),
    and LLM-based user simulation and persona modeling. Spoken dialogue and human-robot interaction recur as settings, but
    speech processing itself is not the defining focus.
  scope_source_urls:
  - https://2026.sigdial.org/calls/main_conference/
  - https://www.sigdial.org/
  scope_last_checked: '2026-10-31'
  source_year: 2026

SLT:
  additional_topics:
  - Biometrics & Human Sensing
  scope_summary: >-
    Biennial IEEE Signal Processing Society workshop on spoken language
    technology, organized by its Speech and Language Processing Technical
    Committee. Characteristic areas are automatic speech recognition
    (conversational, multi-speaker, far-field, low-resource and multilingual),
    speech separation and enhancement, speaker and language recognition and
    diarization, spoken language understanding and spoken dialogue systems,
    speech-to-speech translation, speech summarization and spoken document
    retrieval, text-to-speech, audio-visual speech, emotion recognition and
    child speech. The 2026 call stresses speech foundation models,
    self-supervised representation learning and large language models for
    spoken language processing; demo, system, dataset and benchmark papers
    became a peer-reviewed proceedings track. Its special theme on social
    wellbeing and privacy (voice technology in healthcare, privacy and
    anonymization, spoofing and deepfake detection, fairness, forensics) is
    edition-specific and not tagged. Speaker recognition and emotion
    recognition motivate the human-sensing tag. SPS describes SLT 2026 as the
    last standalone SLT before its new ASLI conference starts in 2027.
  scope_source_urls:
  - https://attend.ieee.org/slt-2026/call-for-papers/
  - https://attend.ieee.org/slt-2026/call-for-demo-system-and-data-papers/
