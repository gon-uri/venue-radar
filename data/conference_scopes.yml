    leakage-aware benchmarks, and consistency of simulated trajectories.
  scope_source_urls:
    - https://fmts-workshop.github.io/cfp.html
  scope_last_checked: '2026-10-07'
  source_year: 2026

AALTD:
  additional_topics:
    - Deep Representation Learning
  scope_summary: >-
    Analytics and learning specifically for temporal data: time-series
    classification, clustering, forecasting, segmentation, anomaly detection,
    temporal representations, and metric or kernel learning. Includes temporal
    foundation models, data streams, and explainable temporal analysis. Climate,
    health, and energy are examples of applications rather than separate
    defining topic assignments.
  scope_source_urls:
    - https://ecml-aaltd.github.io/aaltd2026/
  scope_last_checked: '2026-10-07'
  source_year: 2026

CHIL:
  additional_topics:
    - Explainability & Interpretability
    - Human-AI Interaction & Deployment
    - Robustness & Safety
    - Time Series & Sequential Data
  scope_summary: >-
    Machine learning and inference for clinical, public, and population health.
    Distinguishing areas include causal inference, survival analysis, multimodal
