    Venn-Abers multi-probability prediction, conformal predictive distributions,
    algorithmic randomness and on-line compression modelling, conformal anomaly
    detection, and conformal test martingales for change-point and shift
    detection. A recurring strand uses conformal methods for explanation,
    fairness and decision making. Applications across medicine, bioinformatics,
    LLMs and security appear, but the community is defined by conformal
    methodology rather than an application domain.
