  scope_source_urls:
    - https://chil.ahli.cc/submit/call-for-papers/
  scope_last_checked: '2026-10-07'
  source_year: 2026

MIDL:
  additional_topics:
    - Computer Vision & Pattern Recognition
    - Probabilistic, Causal & Uncertainty ML
    - Explainability & Interpretability
    - Robustness & Safety
    - Federated & Distributed Learning
  scope_summary: >-
    Deep learning for biomedical image analysis, especially segmentation,
    detection, reconstruction, registration, generative imaging, and learning
    from limited labels. Uncertainty, interpretability, multi-site learning,
    robustness, and clinical validation extend that imaging core. Multimodal
    foundation models are relevant when grounded in medical imaging.
  scope_source_urls:
    - https://2026.midl.io/call-for-papers
  scope_last_checked: '2026-10-07'
  source_year: 2026

CCN:
  additional_topics:
    - Cognitive Science & Computational Cognition
    - Explainability & Interpretability
  scope_summary: >-
    Cognitive computational neuroscience, connecting experiments and models
    of brain computation with artificial intelligence. Characteristic work
