  scope_last_checked: '2026-10-31'
  source_year: 2026

SNL:
  additional_topics:
  - Computational Neuroscience
  - Natural Language Processing & LLMs
  - Healthcare & Clinical AI
  scope_summary: 'Neurobiological basis of language: how the brain perceives, comprehends, produces, acquires and
    reads spoken, signed and written language in children and adults. The society''s meeting brings together behavioral,
    neuroimaging (fMRI, structural/diffusion MRI), electrophysiological (EEG/MEG, intracranial recordings), neurostimulation
    and neuropsychological approaches, plus animal and comparative models. Recurring submission areas include speech
    perception and motor control, lexical and combinatorial semantics, syntax, discourse, multilingualism, reading
    and writing, sign language and gesture, and executive control. Acquired and developmental language disorders
    such as aphasia and speech-language treatment form a characteristic clinical strand. A smaller computational
    strand covers encoding models and alignment of brain responses with large language models; NLP work belongs
    here only through what it reveals about language in the brain. Contributions are peer-reviewed 500-word abstracts
    for slide or poster presentations, plus organizer-proposed symposia.'
  scope_source_urls:
  - https://2026.neurolang.org/about/
  - https://2026.neurolang.org/abstract-submissions/
  - https://2026.neurolang.org/poster-sessions/
  scope_last_checked: '2026-10-31'
  source_year: 2026

UMAP:
  additional_topics:
  - Explainability & Interpretability
  - Natural Language Processing & LLMs
  - Information Retrieval & Search
  - Data Mining & Data Science
  scope_summary: 'User modeling, adaptation and personalization at the boundary of AI and HCI: building, evaluating and
    using models of users'' preferences, knowledge, capabilities, context and cognitive or affective states so that interactive
    systems can adapt to them. Characteristic strands are recommender systems and personalized information access
    (including search and conversational recommendation), intelligent and adaptive user interfaces, adaptive e-learning
    and educational systems, personalized behavior change and health or well-being applications, and group modeling.
    The 2027 call stresses generative AI and LLMs for personalization, user modeling for conversational, embodied
    and agentic systems, long-term user models with user-controlled memory, and user simulation. A strong human-centered
    strand covers explainable, inspectable and editable user models, user agency and control, fairness, bias, privacy
    and inclusivity, plus longitudinal and interactive evaluation of adaptive systems. Contributions range from algorithms
    to theoretical and human-centered studies, but must make clear their contribution to user modeling, adaptation
    or personalization.'
  scope_source_urls:
  - https://um.org/umap2027/call-for-full-and-short-paper/
  - https://um.org/umap2027/
  scope_last_checked: '2026-10-31'
  source_year: 2027

WASPAA:
  additional_topics:
  - Deep Representation Learning
  scope_summary: Biennial workshop of the IEEE SPS Audio and Acoustic Signal Processing Technical Committee on signal
    processing applied to audio and acoustics, in a small residential format where all papers are posters and the
    top-scored get spotlight talks. Characteristic strands are microphone- and loudspeaker-array processing, source
    separation, dereverberation, noise and echo reduction, room acoustics and spatial audio; acoustic scene and
    event analysis, localization and audio captioning; music signal analysis, transcription, separation and content-based
    retrieval; generative audio and neural audio coding; hearing aids, auditory perception and quality or intelligibility
    assessment; and audio security and privacy such as deepfake detection, watermarking and speaker de-identification.
    Speech appears through enhancement, coding, generation and intelligibility rather than recognition or language
    processing. The call names generative models and representation learning explicitly. Profile from the WASPAA
    2025 call; the 2027 call was not yet posted on 2026-10-31.
  scope_source_urls:
  - https://www.waspaa.com/waspaa25/call-for-papers/
  - https://waspaa.com/
  - https://signalprocessingsociety.org/our-story/news-updates/2025/11/waspaa-2025-lake-tahoe-new-chapter-beloved-audio-and-acoustic-signal-processing-workshop
  scope_last_checked: '2026-10-31'
  source_year: 2025

EAAMO:
  additional_topics:
    - Human-AI Interaction & Deployment
    - Probabilistic, Causal & Uncertainty ML
    - Autonomous Agents & Multiagent Systems
  scope_summary: >-
    Algorithms, mechanism design and optimization that advance equity and
    access to opportunity for underserved communities, across the
    research-to-practice pipeline. The venue joins AI/ML, operations research,
    economics and market design with HCI and social-science perspectives.
    Characteristic work includes fair division and resource allocation,
    matching markets such as school choice, computational social choice and
    game theory, causal evaluation of algorithmic interventions, empirical
    studies of deployed systems and policies, datasets and benchmarks, and data
    and AI governance and regulation, in domains such as education, housing,
    labor, credit, healthcare and public services. Tracks also take position
    papers and problem pitches, and papers are expected to engage with ethical
    implications; an equity or access question should be central rather than
    a passing motivation for generic ML or optimization.
  scope_source_urls:
    - https://conference2026.eaamo.org/cfp/
    - https://conference2026.eaamo.org/program/paper_session/
  scope_last_checked: '2026-10-31'
  source_year: 2026

ECAF:
  additional_topics:
  - Explainability & Interpretability
  - Human-AI Interaction & Deployment
  scope_summary: Interdisciplinary algorithmic fairness research grounded in Europe's legal and societal framework, bringing together computer science, law, philosophy and social science. Characteristic themes include fairness concepts and metrics, bias mitigation and auditing of deployed decision systems, the implications of EU non-discrimination, data protection, platform and AI regulation, empirical studies of discrimination and intersectional inequality in European contexts, fairness-transparency trade-offs, and systemic risks of generative AI and large online platforms. Work without a European focus on other fairness themes is also welcome.
  scope_source_urls:
  - https://2027.ecafconference.org/callForPapers
  - https://ecafconference.org/about/
  scope_last_checked: '2026-10-31'
  source_year: 2027

IFAC WC:
  additional_topics:
  - Reinforcement Learning
  - Machine Learning
  - Complex Systems & Network Science
  - Signal Processing
  scope_summary: >-
    IFAC's triennial flagship congress, aiming at the most complete view of control techniques with the
    widest coverage of application fields. Contributions follow IFAC's nine coordinating committees:
    systems and signals (identification, adaptive and learning, hybrid, stochastic and networked systems);
    design methods (linear, nonlinear, optimal/predictive, robust and distributed-parameter control);
    computers, cognition and communication; mechatronics, robotics and human-machine systems; manufacturing
    and logistics; process and power systems; transportation and vehicles; bio- and ecological systems; and
    social systems, plus new topics. Theory and application papers are roughly balanced. Learning-based
    control (reinforcement and deep learning in control, ML for modelling and identification) and
    multi-agent/networked systems are recurring strands; machine learning and multi-agent systems were the
    two most used keywords among 2023 accepted papers. Energy, automotive, aerospace, biomedical and
    agricultural tracks are control applications rather than separate domain-conference identities.
