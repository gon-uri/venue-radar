SIAM MDS:
  additional_topics:
  - Deep Representation Learning
  - Probabilistic, Causal & Uncertainty ML
  - System Identification & Data-driven Dynamics
  scope_summary: >-
    Mathematical, statistical and computational foundations of data science; the
    meeting of the SIAM Activity Group on Data Science. Characteristic work covers
    learning theory and generalization, the mathematics of deep and diffusion or
    flow generative models, optimization and sampling algorithms, kernel and
    Gaussian-process methods, optimal and measure transport, geometric and
    topological data analysis, tensor methods and randomized numerical linear
    algebra, and scientific machine learning such as operator learning,
    data-driven model reduction, inverse problems and data assimilation. MDS26
    emphasizes data science in high dimensions: dimensionality reduction and
    embeddings, scalable and parallel algorithms, and algebraic and geometric data
    analysis. Contributions are presentation abstracts, mostly in minisymposia,
    not archival papers.
